<script>
const K='vb-scout-v1';
const T=[['kill','Attack'],['ace','Ace'],['block','Block'],['err','Opp. error']];

  const dk=themeMode==='dark'||(themeMode==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches),mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',dk?'#0c1a1d':'#0e6b73')}

try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(themeMode==='auto')applyTheme()})}catch(e){}
applyTheme();
const saveP=()=>{try{localStorage.setItem(PK,JSON.stringify(S.p))}catch(e){}};
const saveT=()=>{try{localStorage.setItem(TK,JSON.stringify(S.t))}catch(e){}};

if(S.p.some(p=>!p.teamId)){let t=S.t.find(x=>x.mine);if(!t){t={id:'t-mine',name:'My team',mine:true};S.t.push(t)}S.p.forEach(p=>{if(!p.teamId)p.teamId=t.id});saveT();saveP()}
const myTeam=()=>S.t.find(t=>t.mine);

/* ===== Toss ===== */
const SIDE={L:'left',R:'right'},oppT=t=>t==='a'?'b':'a',oppS=x=>x==='L'?'R':'L';

  m.toss={w:ts.w,c:ts.c,o:ts.o,serve:r.serve,sides:r.sides};saveSM();S.ts=null;S.mv={id:m.id,step:'lineup'};render();scrollTo(0,0)}

  const seg=(label,items,cur,fn)=>`<div class="card"><b>${label}</b><div class="seg" role="group" aria-label="${esc(label)}" style="margin-top:8px">${items.map(([k,l])=>`<button aria-pressed="${cur===k}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div></div>`;

const hm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

function spie(m,t,set,ro,serving){const R=140,C=150,pt=(a,r)=>{const q=a*Math.PI/180;return[(C+r*Math.sin(q)).toFixed(1),(C-r*Math.cos(q)).toFixed(1)]},lu=set.lu[t],nm=esc(m[t].name);

function sideInfo(m){const set=bset(m),i=m.cur,L=['a','b'].find(t=>sideOfT(m,i,t)==='L');return{set,i,L,Rt:L==='a'?'b':'a',srv:serveOfT(m,i)}}

  let panel='';
  if(!ro){if(S.bp){const t=S.bp.t,p=S.bp.p,cur=set.lu[t][p-1],used=new Set(set.lu[t].filter(Boolean)),pool=m[t].pl.filter(q=>!q.lib);
      panel=`<div class="card"><b style="color:${tcol(t)}">${esc(m[t].name)}: position ${p}</b><div class="mut">Choose the player.</div><div class="row" style="margin-top:8px">${pool.map(q=>`<button${used.has(q.n)&&q.n!==cur?' disabled':''} onclick="bpPlace('${q.n}')" aria-pressed="${q.n===cur}">#${esc(q.n)}${q.name?' '+esc(q.name):''}${q.cap?' (C)':''}</button>`).join('')}${cur?'<button class="del" onclick="bpClear()">Clear</button>':''}</div></div>`}
    else panel=`<div class="mut" style="margin-top:10px">Tap a position on a team's pie to place a player. Position 1 is the server.</div>`;
    if(m.rule&&m.rule.five)panel+=`<div class="card"><b>Five-player team</b><div class="mut">Greys out position 6: three players in front, two in the back.</div><div class="row" style="margin-top:8px">${[L,Rt].map(t=>`<button onclick="bpFive('${t}')" aria-pressed="${f5(set,t)}">${esc(m[t].name)}: ${f5(set,t)?'5 players':'6 players'}</button>`).join('')}</div></div>`;
    panel+=ready?`<div style="margin-top:12px"><button class="pri" onclick="goStep('board')">Continue to the scoreboard</button></div>`:`<div class="mut" style="margin-top:6px">The scoreboard opens when both teams have a full line-up.</div>`}
  else panel=`<div class="mut" style="margin-top:10px">Set ${i+1} has started, so its line-up can no longer be changed.</div>`;
  return`${crumbs(m,'lineup')}<div class="sbh">${head(L)}<div class="st">Set ${i+1}${startedTxt(set)}</div>${head(Rt)}</div><div class="sb">${col(L)}${col(Rt)}</div>${panel}`}
function boardView(){const m=S.sm.find(x=>x.id===S.mv.id);if(!m||!m.toss||!m.toss.serve){S.mv=null;return scorerMatches()}
  const{set,i,L,Rt,srv}=sideInfo(m);if(!lineupDone(m)){S.mv.step='lineup';return lineupView()}
  const on=set.on,dis=on?'':' disabled',col=t=>`<div class="col">${spie(m,t,set,true,t===srv)}${libLine(m,t)}<div class="row" style="flex-wrap:nowrap;gap:8px;margin-top:8px;align-items:stretch;${t===Rt?'flex-direction:row-reverse;':''}${on?'':'opacity:.45'}"><div class="big" style="background:${tcol(t)}" aria-label="${esc(m[t].name)} points"${on?'':' aria-disabled="true"'}>0</div><div class="sets" style="border-color:${tcol(t)}" aria-label="${esc(m[t].name)} sets won"><small>Sets</small>0</div></div><div class="acts"><button${dis}>Substitution</button><button${dis}>Timeout</button></div></div>`;
  const head=t=>`<div><div class="nm" style="color:${tcol(t)}">${esc(m[t].name)}</div><div class="mut" style="font-size:12px">${t===srv?'Serving':'Receiving'}${f5(set,t)?' · 5 players':''}</div></div>`;
  return`${crumbs(m,'board')}<div class="sbh">${head(L)}<div class="st">Set ${i+1}${startedTxt(set)}</div>${head(Rt)}</div><div class="sb">${col(L)}${col(Rt)}</div>${on?`<div class="mut" style="margin-top:10px">Set ${i+1} is in progress. Points, substitutions and timeouts come in the next version.</div>`:`<div style="margin-top:12px"><button class="pri" onclick="startSetS()">Start set ${i+1}</button><div class="mut" style="margin-top:4px">The score and the buttons switch on when the set starts. The line-up can still be changed until then.</div></div>`}`}
/* ===== Organiser (name or logo in the first cell of the sheet) ===== */
const ORGK='vb-scout-org-v1';
let ORG={name:'',logo:''};try{const r=JSON.parse(localStorage.getItem(ORGK)||'null');if(r&&typeof r==='object')ORG={name:String(r.name||''),logo:String(r.logo||'')}}catch(e){}
const orgSave=()=>{try{localStorage.setItem(ORGK,JSON.stringify(ORG))}catch(e){}};
const orgLogoOk=()=>/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(ORG.logo);
function orgSetName(v){ORG.name=String(v).slice(0,60);orgSave()}
function orgClearLogo(){ORG.logo='';orgSave();render()}
function orgPickLogo(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type)){alert('Choose an image file.');return}
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,400/img.width,160/img.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    try{ORG.logo=c.toDataURL('image/png')}catch(e){alert('This image cannot be used.');return}orgSave();render()};img.onerror=()=>alert('This image cannot be read.');img.src=rd.result};rd.readAsDataURL(f)}
function orgCard(){return`<div class="card"><h2 style="margin-top:0">Organiser</h2><div class="mut">Shown in the first cell at the top of the scoresheet: the logo if there is one, otherwise the name.</div><label for="org-n">Name</label><input id="org-n" autocomplete="off" value="${esc(ORG.name)}" onchange="orgSetName(this.value);render()" maxlength="60"><label for="org-l">Logo</label>${orgLogoOk()?`<div class="sgbox" style="max-width:220px"><img src="${ORG.logo}" alt="Organiser logo" style="display:block;max-width:100%;max-height:70px;margin:0 auto"></div>`:''}<input id="org-l" type="file" accept="image/*" onchange="orgPickLogo(this)">${orgLogoOk()?'<div class="row" style="margin-top:8px"><button class="del" onclick="orgClearLogo()">Remove logo</button></div>':''}</div>`}
/* ===== Scoresheet (A5 landscape, one page) ===== */
function sheetHtml(m){
  const P=t=>m[t].pl.filter(p=>!p.lib).sort((a,b)=>+a.n-+b.n),Lb=t=>m[t].pl.filter(p=>p.lib).sort((a,b)=>+a.n-+b.n);
  const N=(m.rule&&m.rule.sets&&m.rule.sets.length)||3,rows=Math.max(12,P('a').length,P('b').length),lrows=Math.max(2,Lb('a').length,Lb('b').length);
  const rhn=Math.max(2.4,Math.min(5.2,(129-63)/(rows+lrows+N)-.25)),rh=rhn.toFixed(2)+'mm',fs=rhn>=4.6?8:rhn>=3.2?7:6.2;
  const cell=(p,flag)=>p?`<td></td><td class="n">${p.cap&&!flag?`<span class="cap">${esc(p.n)}</span>`:esc(p.n)}</td><td>${esc(p.name||'')}</td>`:'<td></td><td></td><td></td>';
  let body='';
  for(let i=0;i<rows;i++)body+=`<tr>${cell(P('a')[i])}${cell(P('b')[i])}</tr>`;
  let lib='';
  for(let i=0;i<lrows;i++)lib+=`<tr>${cell(Lb('a')[i],1)}${cell(Lb('b')[i],1)}</tr>`;
  const table=`<table class="rt"><colgroup><col style="width:7mm"><col style="width:7mm"><col><col style="width:7mm"><col style="width:7mm"><col></colgroup>
<tr><th colspan="3" style="font-size:${fitPt('Team: '+m.a.name,34.4,7,5,1)}pt">Team: ${esc(m.a.name)}</th><th colspan="3" style="font-size:${fitPt('Team: '+m.b.name,34.4,7,5,1)}pt">Team: ${esc(m.b.name)}</th></tr>
<tr class="h"><td>MVP</td><td>#</td><td>Name</td><td>MVP</td><td>#</td><td>Name</td></tr>${body}
<tr class="sep"><td colspan="6">LIBERO PLAYERS</td></tr>${lib}
<tr class="sep"><td colspan="6">SIGNATURES BEFORE MATCH</td></tr>
<tr class="sig"><td colspan="3">${sigSvg(m.sig&&m.sig.a,1)}</td><td colspan="3">${sigSvg(m.sig&&m.sig.b,1)}</td></tr></table>`;
  /* result table: a 24-unit grid so halves (12) and thirds (8) line up with the roster table */
  let setRows='';
  for(let i=1;i<=N;i++)setRows+=`<tr><td colspan="3"></td><td colspan="4"></td><td colspan="3"></td><td colspan="4" class="n">Set ${i}</td><td colspan="3"></td><td colspan="4"></td><td colspan="3"></td></tr>`;
  const win=m.res&&m.res.winner&&m[m.res.winner]?esc(m[m.res.winner].name):'';
  const result=`<table class="rs"><colgroup>${'<col>'.repeat(24)}</colgroup>
<tr class="h"><td colspan="3">Subs</td><td colspan="4">Timeouts</td><td colspan="3">Points</td><td colspan="4">Results</td><td colspan="3">Points</td><td colspan="4">Timeouts</td><td colspan="3">Subs</td></tr>${setRows}
<tr class="wn"><td colspan="10">WINNER:</td><td colspan="14">${win}</td></tr>
<tr class="sep"><td colspan="24">SIGNATURES AFTER MATCH</td></tr>
<tr class="sig"><td colspan="12"></td><td colspan="12"></td></tr>
<tr class="rf"><td colspan="8"><span class="cp">1st referee</span></td><td colspan="8"><span class="cp">2nd referee</span></td><td colspan="8"><span class="cp">Scorer</span></td></tr></table>`;
  const remarks='<table class="rm"><tr><td>REMARKS</td></tr></table>';
  const tabs=[],normal=N>=3?N-1:N,tm=(i)=>m.sets&&m.sets[i]&&m.sets[i].t0?hm(m.sets[i].t0):':';
  const shr=(n)=>`<div class="shr"><span class="sm"><b>Start</b></span><span class="sm">${tm(n-1)}</span><span class="bg">SET ${n}</span><span class="sm"><b>End</b></span><span class="sm">:</span></div>`;
  /* second row of a set box: team names, with R and S (receive / serve) circled; the one that applies is filled. The deciding set needs its own toss, so it stays unmarked. */
  const srv=n=>(!m.toss||!m.toss.serve||(N>=3&&n===N))?null:serveOfT(m,n-1);
  const LW=210-12-72-4;
  const tn=(t,n,w)=>{const sv=srv(n),nm=t?m[t].name:'',fs=fitPt('Team: '+nm,(w*6/7-2-3.9)*.86,8,5,2);return`<div class="tn"><span class="tl"><span class="nm" style="font-size:${fs}pt"><b>Team:</b> ${esc(nm)}</span><span class="rs2"><i class="cir${t&&sv&&sv!==t?' on':''}">R</i><i class="cir${t&&sv===t?' on':''}">S</i></span></span><span class="pt"><b>POINTS</b></span></div>`};
  const grp=`<div class="sg">${['I','II','III','IV','V','VI',''].map(x=>`<span>${x}</span>`).join('')}</div>`;
  /* rows under the roman numbers: 2 empty, 2 with a colon, then rows with each cell split in two (4 for a set to 25, 3 for a lower limit such as 23). The 7th column stays open (the POINTS column). */
  const lim=n=>{const r=m.rule&&m.rule.sets&&m.rule.sets[n-1];return r?(+r.hard||+r.win||25):25};
  const gcells=(k,r,R)=>{if(k==='h')return Array.from({length:6},(_,c)=>`<span class="hf"><i><b class="no">${r+1}</b></i><i><b class="no">${R+r+1}</b></i></span>`).join('')+'<span class="f"></span>';const c=k==='c'?'<span class="co">:</span>':'<span></span>';return c.repeat(6)+'<span class="f"></span>'};
  const sgrid=(n,q)=>{const R=lim(n)>=25?4:3,ks=['e','e','c','c'].concat(Array(R).fill('h'));return`<div class="sgrid">${ks.map((k,i)=>`<div class="gr">${Array(q||2).fill(`<div class="sg">${gcells(k,i-4,R)}</div>`).join('')}</div>`).join('')}</div>`};
  /* normal set boxes hold 2 teams; the tie break table holds 3 team blocks (the third repeats the first team: the teams change courts at 8 points) */
  const shs=(n,k)=>{const ts=k===3?['a','b','a']:['a','b'],w=k===3?LW/3:(LW-2)/4-.3;return`<div class="shs">${ts.map(t=>tn(t,n,w)).join('')}</div><div class="sv">${ts.map(()=>grp).join('')}</div>`};
  for(let i=0;i<normal;i+=2){const a=i+1,b=i+2<=normal?i+2:0;tabs.push(`<div class="stable" data-sets="${a}${b?','+b:''}"><div class="sbox">${shr(a)}${shs(a)}${sgrid(a)}</div><div class="sbox${b?'':' none'}">${b?shr(b)+shs(b)+sgrid(b):''}</div></div>`)}
  if(N>=3)tabs.push(`<div class="stable tie" data-sets="${N}">${shr(N)}${shs(N,3)}${sgrid(N,3)}</div>`);
  const hcell=(t,k,w)=>{const v=String((m.hd&&m.hd[k])||'');return`<div class="hr"><span class="ht">${t}</span><span class="hd" style="font-size:${fitPt(v,w,7,4.5,1)}pt">${esc(v)}</span></div>`};
  const org=orgLogoOk()?`<img src="${ORG.logo}" alt="Organiser logo">`:ORG.name?esc(ORG.name):'<span class="ph">Organiser</span>';
  return`<div class="sheet"><div class="shead"><div class="org">${org}</div><div class="hc h2">${hcell("Venue","venue",64)}${hcell("Match","match",64)}</div><div class="hc h3">${hcell("Match #","no",34)}${hcell("Court","court",34)}</div><div class="hc h4">${hcell("Referee Team","ref",52)}</div></div><div class="sbody"><div class="sets">${tabs.join('')}</div><div class="right" data-rows="${rows+lrows+N}" style="--rh:${rh};--fs:${fs}pt">${table}${result}${remarks}</div></div></div>`}
function openSheet(id){const m=S.sm.find(x=>x.id===id);if(!m)return;S.sx=null;S.ts=null;S.rx=null;S.bp=null;S.mv={id,step:'sheet'};render();scrollTo(0,0)}
function sheetView(){const m=S.sm.find(x=>x.id===S.mv.id);if(!m){S.mv=null;return scorerMatches()}
  return`${crumbs(m,'sheet')}<div class="row sp"><button class="pri" onclick="window.print()">Print / save as PDF</button></div><div class="mut" style="margin:6px 0">A5 landscape, one page. In the print dialog choose Save as PDF, margins none, scale 100%. This is a preview and fills in as the match is recorded.</div><div class="sheetwrap">${sheetHtml(m)}</div>`}
function fitCrumbs(){const ol=document.querySelector('.crumbs ol'),c=ol&&ol.querySelector('.cur');if(c)ol.scrollLeft=Math.max(0,c.offsetLeft-ol.offsetLeft-70)}
function fitPt(txt,w,max,min,lines){for(let f=max;f>=min;f-=.25){const L=Math.ceil(String(txt).length*.58*f*.3528*1.08/Math.max(1,w));if(L<=lines&&L*f*.3528*1.1<=6.2)return f}return min}
function fitNames(){document.querySelectorAll('.sheet .nm,.sheet .rt th,.sheet .hd').forEach(el=>{let f=parseFloat(el.style.fontSize)||7;for(let i=0;i<16&&(el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1)&&f>4.5;i++){f-=.25;el.style.fontSize=f+'pt'}})}
function fitRight(){const r=document.querySelector('.sheet .right'),b=document.querySelector('.sheet .sbody');if(!r||!b||!b.clientHeight)return;const rows=+r.getAttribute('data-rows')||19;let rh=parseFloat(r.style.getPropertyValue('--rh'))||3;
  for(let i=0;i<6&&r.scrollHeight>b.clientHeight+1;i++){rh=Math.max(2.2,rh-(r.scrollHeight-b.clientHeight)/3.7795/rows-.02);r.style.setProperty('--rh',rh.toFixed(2)+'mm');r.style.setProperty('--fs',(rh>=4.6?8:rh>=3.2?7:6.2)+'pt')}}
function fitSheet(){fitRight();fitNames();const w=document.querySelector('.sheetwrap');if(!w)return;const sh=w.firstElementChild,k=w.clientWidth?Math.min(1,w.clientWidth/793.7):1;sh.style.transformOrigin='0 0';sh.style.transform='scale('+k+')';w.style.height=(559.4*k)+'px'}
window.addEventListener('resize',fitSheet);window.addEventListener('beforeprint',()=>{fitRight();fitNames()});
function renderScorer(){const t=S.stab;
  document.getElementById('app').innerHTML=(t==='rules'?(S.rd?ruleForm():'<h1>Rules</h1>'+rulesHtml()):t==='settings'?scorerSettings():t==='tournaments'?sttList():scorerMatches())+VER;
  ['matches','tournaments','rules','settings'].forEach(k=>{const b=document.getElementById('t-s'+k);if(!b)return;if(t===k)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});fitSheet();fitCrumbs();sgBind()}
function render(){const nav=document.getElementById('mainnav'),app=document.getElementById('app');
  if(appMode===null){nav.style.display='none';app.innerHTML=pickView()+VER;return}
  nav.style.display='';
  if(appMode==='scorer'){if(nav.dataset.m!=='s'){nav.innerHTML=NAV_SCORER;nav.dataset.m='s'}renderScorer();return}
  if(nav.dataset.m!=='c'){nav.innerHTML=NAV_COACH;nav.dataset.m='c'}
  renderCoach()}
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
