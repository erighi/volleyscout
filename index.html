<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volleyball Scout</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e6b73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VB Scout">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef3f2;--card:#fff;--fg:#12262b;--mut:#5d7176;--line:#d3dedd;--home:#0e6b73;--away:#b8730a;--onc:#fff;--bad:#b3362b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a1d;--card:#13282c;--fg:#e6f0ee;--mut:#8ea5a8;--line:#244045;--home:#3fb4be;--away:#e8a33d;--onc:#0c1a1d;--bad:#ef7b6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1a1d;--card:#13282c;--fg:#e6f0ee;--mut:#8ea5a8;--line:#244045;--home:#3fb4be;--away:#e8a33d;--onc:#0c1a1d;--bad:#ef7b6e;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.45 Barlow,system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;margin:0}
h1{font-size:30px;letter-spacing:.2px}h2{font-size:22px;margin:22px 0 8px}
button:disabled{opacity:.5;cursor:not-allowed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--home);outline-offset:2px}
.pri{background:var(--home);color:var(--onc);border-color:var(--home);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;color:inherit}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:52px;font-weight:600;color:var(--mut)}
nav button[aria-current=page]{color:var(--home);box-shadow:inset 0 3px 0 var(--home)}
.m{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.m b{font-size:17px}
.board{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;overflow:hidden;margin:12px 0}
.side{padding:12px 14px;color:var(--onc)}
.side.h{background:var(--home)}.side.a{background:var(--away)}
.side .num{font-size:84px;line-height:1}
.side .nm{font-weight:600;overflow-wrap:anywhere}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pts button{min-height:60px;font-weight:600;border-width:2px}
.pts.h button{border-color:var(--home)}.pts.a button{border-color:var(--away)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;border:0;border-radius:0;background:var(--card);font-weight:600}.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--home);color:var(--onc)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;margin:2px 4px 2px 0}
.banner{background:var(--card);border:2px solid var(--bad);border-radius:10px;padding:10px 12px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
.del{color:var(--bad)}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Sections"><button id="t-teams" onclick="go('teams')">Teams</button><button id="t-matches" onclick="go('matches')">Matches</button><button id="t-stats" onclick="go('stats')">Stats</button></nav>
<script>
const K='vb-scout-v1';
const T=[['kill','Attack kill'],['ace','Ace'],['block','Block'],['err','Opp. error']];
const PK='vb-scout-players-v1',TK='vb-scout-teams-v1';
const ROLES=['Setter','Outside hitter','Opposite','Middle blocker','Libero','Defensive specialist'];
let S={m:[],p:[],t:[],cur:null,tab:'teams',form:false,edit:null,team:null,tform:false};
try{const r=localStorage.getItem(K);if(r)S.m=JSON.parse(r)||[]}catch(e){}
try{const r=localStorage.getItem(PK);if(r)S.p=JSON.parse(r)||[]}catch(e){}
try{const r=localStorage.getItem(TK);if(r)S.t=JSON.parse(r)||[]}catch(e){}
const saveP=()=>{try{localStorage.setItem(PK,JSON.stringify(S.p))}catch(e){}};
const saveT=()=>{try{localStorage.setItem(TK,JSON.stringify(S.t))}catch(e){}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S.m))}catch(e){}};
if(S.p.some(p=>!p.teamId)){let t=S.t.find(x=>x.mine);if(!t){t={id:'t-mine',name:'My team',mine:true};S.t.push(t)}S.p.forEach(p=>{if(!p.teamId)p.teamId=t.id});saveT();saveP()}
const myTeam=()=>S.t.find(t=>t.mine);
const byNum=(a,b)=>(parseInt(a.num,10)||999)-(parseInt(b.num,10)||999)||a.name.localeCompare(b.name);
const teamByName=n=>S.t.find(t=>t.name.toLowerCase()===n.toLowerCase());
function ensureTeam(n){let t=teamByName(n);if(!t){t={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,mine:false};S.t.push(t);saveT()}return t}
const snap=t=>S.p.filter(p=>p.teamId===t.id).map(p=>({pid:p.id,name:p.name,num:p.num,role:p.role}));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=id=>S.m.find(m=>m.id===id);
const sc=(m,i)=>{let h=0,a=0;m.log.forEach(e=>{if(e.s===i){e.t==='h'?h++:a++}});return[h,a]};
const target=(m)=>m.n>=4?15:25;
function go(t){S.tab=t;S.cur=null;S.form=false;S.edit=null;S.team=null;S.tform=false;render()}
function open_(id){S.cur=id;S.mt=get(id).log.length?'scout':'set';S.pick=null;S.setv=null;S.pv='init';render();scrollTo(0,0)}
function nrSel(){return[...document.querySelectorAll('.nr:checked')].map(e=>S.p.find(p=>p.id===e.value))}
function nrStatus(){const el=document.getElementById('nr-st'),f=document.getElementById('f-f');if(!el||!f)return;
  const L=nrSel(),fv=f.value==='fivb',c=cnt(L);el.textContent=fv?`${c.pl} of 12 players, ${c.lib} of 2 liberos`:`${L.length} attending`;el.style.color=over({fmt:f.value},L)?'var(--bad)':''}
function addMatch(){
  const v=id=>document.getElementById(id).value.trim(),my=myTeam();
  const n=v('f-a');if(!n){alert('Enter the opponent name.');return}
  if(n.toLowerCase()===my.name.toLowerCase()){alert('The opponent must be a different team.');return}
  const L=nrSel(),fmt=v('f-f'),msg=over({fmt},L);
  if(msg){alert(msg+' Untick some players or switch to Local tournament.');return}
  const A=ensureTeam(n);
  const m={id:Date.now().toString(36),home:my.name,away:A.name,hid:my.id,aid:A.id,lu:{h:L.map(p=>({pid:p.id,name:p.name,num:p.num,role:p.role})),a:[]},fmt,event:'',date:v('f-d')||new Date().toISOString().slice(0,10),n:0,done:false,log:[],notes:'',st:{}};
  S.m.unshift(m);save();S.form=false;open_(m.id)}
function point(t,type){const m=get(S.cur);if(m.done)return;m.log.push({t,type,s:m.n});save();render()}
function undo(){const m=get(S.cur);const l=m.log[m.log.length-1];if(l&&l.s===m.n){m.log.pop();save();render()}}
function endSet(){const m=get(S.cur);if(m.n<4)m.n++;S.mt='set';S.setv=null;S.pick=null;S.pv='init';save();render();scrollTo(0,0)}
function finish(){const m=get(S.cur);m.done=!m.done;save();render()}
function note(v){get(S.cur).notes=v;save()}
function del(id){if(confirm('Delete this match and its data?')){S.m=S.m.filter(m=>m.id!==id);S.cur=null;save();render()}}
function savePlayer(){
  const v=id=>document.getElementById(id).value.trim();
  const name=v('p-n');if(!name){alert('Enter the player’s name.');return}
  const num=v('p-#');
  if(num!==''&&S.p.some(p=>p.teamId===S.team&&p.num===num&&p.id!==S.edit)&&!confirm('Another player already wears #'+num+'. Save anyway?'))return;
  const d={name,num,role:v('p-r')};
  if(S.edit&&S.edit!=='new'){Object.assign(S.p.find(p=>p.id===S.edit),d)}else{S.p.push({id:Date.now().toString(36),teamId:S.team,...d})}
  saveP();S.edit=null;render()}
function editPlayer(id){S.edit=id;render();const el=document.getElementById('p-n');if(el)el.focus()}
function delPlayer(id){const p=S.p.find(p=>p.id===id);if(confirm('Remove '+p.name+' from the roster? Past matches keep their own copy.')){S.p=S.p.filter(p=>p.id!==id);saveP();S.edit=null;render()}}
function addTeam(){const n=document.getElementById('tm-n').value.trim();if(!n){alert('Enter a team name.');return}
  if(teamByName(n)){alert('That team already exists.');return}
  const mine=document.getElementById('tm-m').checked;if(mine)S.t.forEach(t=>t.mine=false);
  const t={id:'t'+Date.now().toString(36),name:n,mine};S.t.push(t);saveT();S.tform=false;S.team=t.id;render()}
function openTeam(id){S.team=id;S.edit=null;render();scrollTo(0,0)}
function toggleMine(){const t=S.t.find(t=>t.id===S.team);const on=!t.mine;S.t.forEach(x=>x.mine=false);t.mine=on;saveT();render()}
function renameTeam(){const t=S.t.find(t=>t.id===S.team);const n=prompt('Team name',t.name);if(n&&n.trim()){t.name=n.trim();saveT();render()}}
function delTeam(){const t=S.t.find(t=>t.id===S.team);if(confirm('Delete '+t.name+' and its roster? Matches already logged keep their data.')){S.p=S.p.filter(p=>p.teamId!==t.id);S.t=S.t.filter(x=>x.id!==t.id);S.team=null;saveP();saveT();render()}}
const cnt=L=>{const lib=L.filter(x=>x.role==='Libero').length;return{lib,pl:L.length-lib}};
const over=(m,L)=>{if(m.fmt!=='fivb')return'';const c=cnt(L);return c.pl>12?'FIVB allows 12 players plus liberos.':c.lib>2?'FIVB allows 2 liberos at most.':''};
function luSet(s,i,f,v){const m=get(S.cur),L=m.lu[s],t=L.map(x=>({...x}));t[i][f]=v.trim();
  if(f==='role'&&over(m,t)){alert(over(m,t));render();return}
  L[i][f]=v.trim();save();render()}
function unplace(m,pid){Object.values(m.st||{}).forEach(a=>a.forEach((x,i)=>{if(x===pid)a[i]=null}))}
function luDel(s,i){const m=get(S.cur);unplace(m,m.lu[s][i].pid);m.lu[s].splice(i,1);save();render()}
function luToggle(s,pid,on){const m=get(S.cur),L=m.lu[s];
  if(on){const p=S.p.find(p=>p.id===pid),t=[...L,{role:p.role}];if(over(m,t)){alert(over(m,t)+' Remove someone first or change a role.');render();return}
    L.push({pid:p.id,name:p.name,num:p.num,role:p.role})}
  else{unplace(m,pid);m.lu[s]=L.filter(x=>x.pid!==pid)}
  save();render()}
function luGuest(s){const m=get(S.cur),n=(prompt('Player name')||'').trim();if(!n)return;const num=(prompt('Shirt number (optional)')||'').trim();
  const t=[...m.lu[s],{role:''}];if(over(m,t)){alert(over(m,t));return}
  m.lu[s].push({pid:'g'+Date.now().toString(36),name:n,num,role:''});save();render()}
function setFmt(v){get(S.cur).fmt=v;save();render()}
function luRow(s,x,i,lead,rm){return`<div class="row" style="margin-top:8px;flex-wrap:nowrap">${lead}<input aria-label="Shirt number for ${esc(x.name)}" style="width:60px" inputmode="numeric" maxlength="3" value="${esc(x.num)}" onchange="luSet('${s}',${i},'num',this.value)"><select aria-label="Role for ${esc(x.name)}" style="width:auto;max-width:42%" onchange="luSet('${s}',${i},'role',this.value)"><option value="">No role</option>${ROLES.map(r=>`<option${x.role===r?' selected':''}>${r}</option>`).join('')}</select>${rm?`<button aria-label="Remove ${esc(x.name)}" onclick="luDel('${s}',${i})">✕</button>`:''}</div>`}
function luHtml(m,s){const L=m.lu[s],id=s==='h'?m.hid:m.aid,fv=m.fmt==='fivb',c=cnt(L),ro=S.p.filter(p=>p.teamId===id).sort((a,b)=>(parseInt(a.num,10)||999)-(parseInt(b.num,10)||999)||a.name.localeCompare(b.name));
  const st=fv?`${c.pl} of 12 players, ${c.lib} of 2 liberos${c.lib<1?'. Add at least 1 libero.':''}`:`${L.length} attending`;
  let h=`<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px"><div class="row sp"><b>${esc(s==='h'?m.home:m.away)}</b><span class="mut" ${over(m,L)||(fv&&c.lib<1)?'style="color:var(--bad)"':''}>${st}</span></div>`;
  ro.forEach(p=>{const i=L.findIndex(x=>x.pid===p.id);const lead=`<label style="display:flex;gap:8px;align-items:center;color:var(--fg);font-size:16px;margin:0;flex:1;min-width:0"><input type="checkbox" style="width:22px;height:22px;flex:none" ${i>=0?'checked':''} onchange="luToggle('${s}','${p.id}',this.checked)"><span style="overflow-wrap:anywhere">${esc(p.name)}</span></label>`;
    h+=i>=0?luRow(s,L[i],i,lead):`<div class="row" style="margin-top:8px">${lead}<span class="mut">${p.num?'#'+esc(p.num):''}</span></div>`});
  L.forEach((x,i)=>{if(!ro.some(p=>p.id===x.pid))h+=luRow(s,x,i,`<span style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(x.name)}</span>`,true)});
  if(!ro.length&&!L.length)h+=`<div class="mut" style="margin-top:6px">No saved players for this team yet.</div>`;
  return h+`<button style="margin-top:10px" onclick="luGuest('${s}')">Add a player not on the roster</button></div>`}
function rosterView(m){const fv=m.fmt==='fivb';
  return`<label for="mf">Tournament rules</label><select id="mf" onchange="setFmt(this.value)"><option value="local"${fv?'':' selected'}>Local tournament, any number of players</option><option value="fivb"${fv?' selected':''}>Official FIVB, 12 players + 1 or 2 liberos</option></select><div class="mut" style="margin-top:6px">Tick the players attending. Number and role changes apply to this match only.</div>${luHtml(m,'h')}`}
const ANG={3:0,2:60,1:120,6:180,5:240,4:300};
const RL={'Setter':'S','Opposite':'O','Middle blocker':'M','Outside hitter':'H','Libero':'L','Defensive specialist':'D'};
const curSet=m=>S.setv==null||S.setv>m.n?m.n:S.setv;
const setReady=(m,si)=>(m.st[si]||[]).filter(id=>id&&m.lu.h.some(x=>x.pid===id)).length===6&&!!(m.sv||{})[si];
function startSet(){S.mt='scout';S.pv='init';S.pick=null;render();scrollTo(0,0)}
function curLU(m,si){let pos=[0,1,2,3,4,5].map(i=>(m.st[si]||[])[i]||null),sv=(m.sv||{})[si]==='h';
  m.log.forEach(e=>{if(e.s!==si)return;if(e.t==='h'){if(!sv){pos=[pos[1],pos[2],pos[3],pos[4],pos[5],pos[0]];sv=true}}else sv=false});
  return{pos,serving:sv}}
function scoutPie(m){const si=m.n,all=m.lu.h,ok=a=>a.map(id=>all.some(x=>x.pid===id)?id:null),cl=curLU(m,si),cur=S.pv==='cur';
  const arr=cur?ok(cl.pos):ok(m.st[si]||[]),sv=cur?(cl.serving?'h':'a'):(m.sv||{})[si],sp=all.find(x=>x.pid===cl.pos[0]);
  return`<div class="seg" role="group" aria-label="Line-up view" style="margin:12px 0 6px">${[['init','Initial line-up'],['cur','Current']].map(([k,l])=>`<button aria-pressed="${(cur?'cur':'init')===k}" onclick="S.pv='${k}';render()">${l}</button>`).join('')}</div><div style="max-width:260px;margin:0 auto">${pie(m,arr,sv,true)}</div><div class="mut" style="text-align:center" aria-live="polite">${cur?(cl.serving?esc(m.home)+' serving'+(sp?': '+(sp.num?'#'+esc(sp.num)+' ':'')+esc(sp.name):''):esc(m.away)+' serving')+'. Rotates when your team wins the serve back.':'Starting positions for set '+(si+1)+'.'}</div>`}
function setSys(k){get(S.cur).sys=k;save();render()}
function setServe(k){const m=get(S.cur);(m.sv=m.sv||{})[curSet(m)]=k;save();render()}
function pickPos(p){S.pick=S.pick===p?null:p;render()}
function setSetView(i){S.setv=i;S.pick=null;render()}
function setPos(p,pid){const m=get(S.cur),si=curSet(m),a=m.st[si]=m.st[si]||[null,null,null,null,null,null];a[p-1]=pid||null;save();
  const nx=[1,2,3,4,5,6].find(q=>!a[q-1]);S.pick=pid&&nx?nx:null;render()}
function copyPrev(){const m=get(S.cur),si=curSet(m);m.st[si]=[...(m.st[si-1]||[])];save();S.pick=null;render()}
function clearSet(){const m=get(S.cur);m.st[curSet(m)]=[null,null,null,null,null,null];save();S.pick=null;render()}
function pie(m,cur,sv,ro){
  const R=140,C=150,pt=(a,r)=>{const t=a*Math.PI/180;return[(C+r*Math.sin(t)).toFixed(1),(C-r*Math.cos(t)).toFixed(1)]};
  const g=[1,2,3,4,5,6].sort((a,b)=>(a===S.pick)-(b===S.pick)).map(p=>{
    const a=ANG[p],[x1,y1]=pt(a-30,R),[x2,y2]=pt(a+30,R),[tx,ty]=pt(a,R*.58),[lx,ly]=pt(a,R*.87),[rx,ry]=pt(a,R*.2),e=m.lu.h.find(x=>x.pid===cur[p-1]),sel=S.pick===p,srv=p===1&&sv==='h',tc=e?'var(--onc)':'var(--mut)';
    return`<g role="${ro?'img':'button'}"${ro?'':' tabindex="0"'} aria-label="Position ${p}, ${e?'player '+esc(e.num||'')+' '+esc(e.name)+(e.role?', '+esc(e.role):''):'empty'}${srv?', serving':''}" ${ro?'':`onclick="pickPos(${p})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pickPos(${p})}" style="cursor:pointer"`}><path d="M${C} ${C}L${x1} ${y1}A${R} ${R} 0 0 1 ${x2} ${y2}Z" fill="${e?(srv?'var(--away)':'var(--home)'):'var(--card)'}" stroke="${sel?'var(--fg)':srv?'var(--away)':'var(--line)'}" stroke-width="${sel?6:srv?5:2}" stroke-linejoin="round"/><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" fill="${tc}" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="${e?44:32}">${e?esc(e.num||'?'):'+'}</text>${e&&RL[e.role]?`<text x="${rx}" y="${ry}" text-anchor="middle" dominant-baseline="central" fill="${tc}" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="22">${RL[e.role]}</text>`:''}<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" fill="${tc}" font-size="13">P${p}${srv?' serving':''}</text></g>`}).join('');
  return`<svg viewBox="0 0 300 300" role="group" aria-label="Starting line-up" style="width:100%;max-width:340px;display:block;margin:0 auto">${g}</svg>`}
function setView(m){
  const si=curSet(m),cur=m.st[si]=m.st[si]||[null,null,null,null,null,null],all=m.lu.h,sv=(m.sv=m.sv||{})[si];
  const ok=cur.map(id=>all.some(x=>x.pid===id)?id:null),filled=ok.filter(Boolean).length;
  let h='';
  if(m.n>0)h+=`<div style="margin-bottom:8px">${Array.from({length:m.n+1},(_,i)=>`<button class="chip" style="min-height:36px;${i===si?'background:var(--home);color:var(--onc);border-color:var(--home)':''}" aria-pressed="${i===si}" onclick="setSetView(${i})">Set ${i+1}</button>`).join('')}</div>`;
  h+=`<h2 style="margin-top:8px">First serve, set ${si+1}</h2><div class="mut" style="margin-bottom:6px">${esc(m.home)} will:</div><div class="seg" role="group" aria-label="First serve">${[['h','Serve'],['a','Receive']].map(([k,n])=>`<button style="min-height:54px;overflow-wrap:anywhere" aria-pressed="${sv===k}" onclick="setServe('${k}')">${esc(n)}</button>`).join('')}</div>${sv?`<div style="margin-top:6px">${esc(sv==='h'?m.home:m.away)} serves, ${esc(sv==='h'?m.away:m.home)} receives.</div>`:'<div style="color:var(--bad);margin-top:6px">Not set yet. Choose serve or receive for your team.</div>'}
  <h2>Team system</h2><div class="seg" role="group" aria-label="Team system" style="margin-bottom:6px">${['6-2','5-1','4-2','none'].map(k=>`<button aria-pressed="${(m.sys||'none')===k}" onclick="setSys('${k}')">${k==='none'?'None':k}</button>`).join('')}</div><div class="mut">Applies to the whole match.</div>
  <h2>Starting line-up, set ${si+1}</h2>`;
  if(!all.length)return h+`<div class="card"><b>No players in this match yet.</b><div class="mut">Choose who is attending on the Roster tab first.</div><div style="margin-top:12px"><button class="pri" onclick="S.mt='roster';render()">Go to Roster</button></div></div>`;
  h+=`<div class="mut">Tap a slice to choose the player for that position. Numbers run clockwise in rotation order: 1 serves, 2 to 4 are front row (4 is front left), 5 to 6 are back row.</div>
  <div class="mut" style="text-align:center;margin-top:10px">Net</div>${pie(m,ok,sv)}<div class="mut" style="text-align:center">Back of the court</div>
  <div class="mut" style="text-align:center;font-size:13px">S setter, O opposite, M middle, H outside hitter, L libero, D defensive specialist</div>
  <div class="mut" style="text-align:center;margin:6px 0" aria-live="polite">${filled} of 6 positions filled${filled===6?', line-up complete':''}</div>
  <div class="mut" style="text-align:center">${sv==='h'?esc(m.home)+' serves first: the player in P1 serves.':sv==='a'?esc(m.away)+' serves first.':'Choose who serves first.'}</div>`;
  if(S.pick){const p=S.pick,placed=ok.filter((id,i)=>id&&i!==p-1),av=all.filter(x=>!placed.includes(x.pid)).sort(byNum);
    h+=`<div class="card"><div class="row sp"><b>Position ${p}</b>${ok[p-1]?`<button class="del" onclick="setPos(${p},null)">Clear</button>`:''}</div>${av.map(x=>`<button class="m" style="margin:6px 0${x.pid===ok[p-1]?';border-color:var(--home);border-width:2px':''}" onclick="setPos(${p},'${x.pid}')"><b>${x.num?'#'+esc(x.num):'–'}</b> ${esc(x.name)}${x.role?', <span class="mut">'+esc(x.role)+'</span>':''}</button>`).join('')||'<div class="mut">Everyone attending is already placed.</div>'}</div>`}
  h+=`<div class="card">${[1,2,3,4,5,6].map(p=>{const e=all.find(x=>x.pid===ok[p-1]);return`<div class="row" style="padding:3px 0"><span class="mut" style="width:28px">P${p}</span>${e?`<b>${e.num?'#'+esc(e.num):'–'}</b> ${esc(e.name)}${e.role?`<span class="mut">, ${esc(e.role)}</span>`:''}`:'<span class="mut">Empty</span>'}${p===1&&sv==='h'?'<span class="chip" style="margin-left:6px">Serving</span>':''}</div>`}).join('')}</div>
  <div class="row">${si>0&&(m.st[si-1]||[]).some(Boolean)?`<button onclick="copyPrev()">Copy line-up from set ${si}</button>`:''}${filled?'<button class="del" onclick="clearSet()">Clear line-up</button>':''}</div>`;
  if(si===m.n){const need=[filled<6?`${6-filled} position${filled===5?'':'s'} still empty`:'',sv?'':'serve or receive not chosen'].filter(Boolean).join(', ');
    h+=`<div style="margin-top:16px">${!need?`<button class="pri" style="width:100%;min-height:56px;font-size:18px" onclick="startSet()">Start set ${si+1}</button>`:`<button disabled style="width:100%;min-height:56px;font-size:18px">Start set ${si+1}</button><div class="mut" style="margin-top:6px">To start: ${need}.</div>`}</div>`}
  return h}
function tabsHtml(m){return`<div class="seg" role="tablist" style="margin:12px 0">${[['roster','Roster'],['set','Set '+(m.n+1)],['scout','Scout']].map(([k,l])=>`<button role="tab" aria-selected="${S.mt===k}" onclick="S.mt='${k}';S.pick=null;render()">${l}</button>`).join('')}</div>`}
function tally(m){const r={h:{},a:{}};m.log.forEach(e=>{r[e.t][e.type]=(r[e.t][e.type]||0)+1});return r}
function setsWon(m){let h=0,a=0;for(let i=0;i<=m.n;i++){const[x,y]=sc(m,i);if(i<m.n||m.done){if(x>y)h++;else if(y>x)a++}}return[h,a]}

function listView(){
  const my=myTeam();
  let h=`<div class="row sp"><h1>Matches</h1>${my?`<button class="pri" onclick="S.form=!S.form;render()">${S.form?'Cancel':'New match'}</button>`:''}</div>`;
  if(!my)h+=`<div class="card"><b>Set up your team first.</b><div class="mut">Matches use your team and its players. Add it on the Teams tab and tick “This is my team”.</div><div style="margin-top:12px"><button class="pri" onclick="go('teams')">Go to Teams</button></div></div>`;
  if(S.form&&my){
    const ps=S.p.filter(p=>p.teamId===my.id).sort(byNum);
    h+=`<div class="card"><datalist id="tl">${S.t.filter(t=>!t.mine).map(t=>`<option value="${esc(t.name)}">`).join('')}</datalist>
    <label for="f-a">Opponent</label><input id="f-a" list="tl" autocomplete="off">
    <label for="f-f">Tournament rules</label><select id="f-f" onchange="nrStatus()"><option value="local">Local tournament, any number of players</option><option value="fivb">Official FIVB, 12 players + 1 or 2 liberos</option></select>
    <label for="f-d">Date</label><input id="f-d" type="date" value="${new Date().toISOString().slice(0,10)}">
    <div class="row sp" style="margin-top:16px"><b>Who is playing (${esc(my.name)})</b><span id="nr-st" class="mut"></span></div>
    ${ps.length?ps.map(p=>`<label style="display:flex;gap:8px;align-items:center;color:var(--fg);font-size:16px;margin:6px 0"><input type="checkbox" class="nr" value="${p.id}" style="width:22px;height:22px;flex:none" checked onchange="nrStatus()"><span>${p.num?'#'+esc(p.num)+' ':''}${esc(p.name)}${p.role?', '+esc(p.role):''}</span></label>`).join(''):`<div class="mut">Your team has no players yet. Add them on the Teams tab.</div>`}
    <div style="margin-top:14px"><button class="pri" onclick="addMatch()">Create match</button></div></div>`}
  if(!S.m.length&&!S.form&&my)h+=`<div class="card"><b>No matches yet.</b><div class="mut">Tap “New match” to create your first one.</div></div>`;
  [...S.m].sort((a,b)=>b.date.localeCompare(a.date)).forEach(m=>{
    const[a,b]=setsWon(m);
    h+=`<button class="m" onclick="open_('${m.id}')"><div class="row sp"><b>${esc(m.home)} vs ${esc(m.away)}</b><span class="num" style="font-size:24px">${a}–${b}</span></div><div class="mut">${esc(m.date)}${m.event?', '+esc(m.event):''}, ${m.done?'final':'in progress'}</div></button>`});
  return h}

function matchView(m){
  m.lu=m.lu||{h:[],a:[]};m.st=m.st||{};
  const[x,y]=sc(m,m.n),tg=target(m),[sh,sa]=setsWon(m),tl=tally(m);
  const lead=Math.abs(x-y),won=(x>=tg||y>=tg)&&lead>=2;
  let h=`<div class="row sp"><button onclick="go('matches')">Back</button><button class="del" onclick="del('${m.id}')">Delete</button></div>
  <h1 style="margin-top:10px">${esc(m.home)} vs ${esc(m.away)}</h1>
  <div class="mut">${esc(m.date)}${m.event?', '+esc(m.event):''}, ${m.fmt==='fivb'?'Official FIVB':'Local tournament'}${m.sys&&m.sys!=='none'?', '+m.sys+' system':''}, set ${m.n+1}${m.done?', final':''} (sets ${sh}–${sa})</div>
  ${tabsHtml(m)}`;
  if(S.mt==='roster')return h+rosterView(m);
  if(S.mt==='set')return h+setView(m);
  if(!setReady(m,m.n)&&!m.log.some(e=>e.s===m.n))return h+`<div class="card"><b>Set ${m.n+1} is not set up yet.</b><div class="mut">Choose the line-up and serve or receive first, then start the set.</div><div style="margin-top:12px"><button class="pri" onclick="S.mt='set';render()">Go to Set ${m.n+1}</button></div></div>`;
  h+=`<div class="board" aria-live="polite"><div class="side h"><div class="nm">${esc(m.home)}</div><div class="num">${x}</div></div><div class="side a"><div class="nm">${esc(m.away)}</div><div class="num">${y}</div></div></div>`;
  if(won&&!m.done)h+=`<div class="banner"><b>${x>y?esc(m.home):esc(m.away)}</b> has won set ${m.n+1}. ${m.n<4?'End the set to start the next one.':'Finish the match to lock the result.'}</div>`;
  h+=scoutPie(m);
  if(!m.done){
    h+=`<div class="pts h" style="margin-bottom:8px"><div class="mut" style="grid-column:1/3">Point for ${esc(m.home)}</div>${T.map(([k,l])=>`<button onclick="point('h','${k}')">${l}</button>`).join('')}</div>
    <div class="pts a"><div class="mut" style="grid-column:1/3">Point for ${esc(m.away)}</div>${T.map(([k,l])=>`<button onclick="point('a','${k}')">${l}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button onclick="undo()" ${m.log.length?'':'disabled'}>Undo last point</button>${m.n<4?`<button onclick="endSet()">End set ${m.n+1}</button>`:''}<button class="pri" onclick="finish()">Finish match</button></div>`}
  else h+=`<div class="row"><button onclick="finish()">Reopen match</button></div>`;
  h+=`<h2>Set scores</h2><div>${Array.from({length:m.n+1},(_,i)=>{const[a,b]=sc(m,i);return`<span class="chip">Set ${i+1}: ${a}–${b}</span>`}).join('')}</div>
  <h2>How points were scored</h2><div class="card sc"><table><tr><th></th><th>${esc(m.home)}</th><th>${esc(m.away)}</th></tr>${T.map(([k,l])=>`<tr><td>${l}</td><td>${tl.h[k]||0}</td><td>${tl.a[k]||0}</td></tr>`).join('')}</table></div>
  <h2>Scouting notes</h2><textarea rows="5" aria-label="Scouting notes" placeholder="Rotations, serving targets, weak passers, setter habits" onchange="note(this.value)">${esc(m.notes)}</textarea>`;
  return h}

function teamsView(){
  if(S.team){
    const t=S.t.find(x=>x.id===S.team),ed=S.edit&&S.edit!=='new'?S.p.find(p=>p.id===S.edit):null;
    const L=S.p.filter(p=>p.teamId===t.id).sort((a,b)=>(parseInt(a.num,10)||999)-(parseInt(b.num,10)||999)||a.name.localeCompare(b.name));
    let h=`<div class="row sp"><button onclick="S.team=null;S.edit=null;render()">Back</button><div class="row"><button onclick="toggleMine()">${t.mine?'Not my team':'Set as my team'}</button><button onclick="renameTeam()">Rename</button><button class="del" onclick="delTeam()">Delete</button></div></div>
    <div class="row sp" style="margin-top:10px"><h1>${esc(t.name)}</h1>${S.edit?'':'<button class="pri" onclick="editPlayer(\'new\')">Add player</button>'}</div>
    <div class="mut">${t.mine?'Your team. ':''}These are default numbers and roles. Each new match gets a copy you can change without touching this roster.</div>`;
    if(S.edit)h+=`<div class="card"><label for="p-n">Name</label><input id="p-n" autocomplete="off" value="${esc(ed?ed.name:'')}"><label for="p-#">Shirt number</label><input id="p-#" inputmode="numeric" maxlength="3" autocomplete="off" value="${esc(ed?ed.num:'')}"><label for="p-r">Preferred role</label><select id="p-r"><option value="">Not set</option>${ROLES.map(r=>`<option${ed&&ed.role===r?' selected':''}>${r}</option>`).join('')}</select>
    <div class="row" style="margin-top:14px"><button class="pri" onclick="savePlayer()">Save player</button><button onclick="S.edit=null;render()">Cancel</button>${ed?`<button class="del" onclick="delPlayer('${ed.id}')">Remove</button>`:''}</div></div>`;
    if(!L.length&&!S.edit)h+=`<div class="card"><b>No players yet.</b><div class="mut">Add each player with a shirt number and preferred role.</div></div>`;
    L.forEach(p=>{h+=`<button class="m" onclick="editPlayer('${p.id}')"><div class="row"><span class="num" style="font-size:34px;min-width:52px">${p.num?'#'+esc(p.num):'–'}</span><div><b>${esc(p.name)}</b><div class="mut">${p.role?esc(p.role):'Role not set'}</div></div></div></button>`});
    return h}
  let h=`<div class="row sp"><h1>Teams</h1><button class="pri" onclick="S.tform=!S.tform;render()">${S.tform?'Cancel':'Add team'}</button></div>`;
  if(S.tform)h+=`<div class="card"><label for="tm-n">Team name</label><input id="tm-n" autocomplete="off"><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="tm-m" type="checkbox" style="width:auto" ${S.t.length?'':'checked'}>This is my team</label><div style="margin-top:14px"><button class="pri" onclick="addTeam()">Save team</button></div></div>`;
  if(!S.t.length&&!S.tform)h+=`<div class="card"><b>Start with your own team.</b><div class="mut">Save it once with its players, then pick it for every match. Opponents can be saved too.</div></div>`;
  [...S.t].sort((a,b)=>(b.mine?1:0)-(a.mine?1:0)||a.name.localeCompare(b.name)).forEach(t=>{const n=S.p.filter(p=>p.teamId===t.id).length;
    h+=`<button class="m" onclick="openTeam('${t.id}')"><div class="row sp"><b>${esc(t.name)}</b><span class="mut">${t.mine?'Your team, ':''}${n} player${n===1?'':'s'}</span></div></button>`});
  return h}

function statsView(){
  const R={};
  S.m.forEach(m=>{
    [['h',m.home],['a',m.away]].forEach(([s,name])=>{
      const k=name.toLowerCase();const r=R[k]=R[k]||{name,m:0,sw:0,sl:0,kill:0,ace:0,block:0,err:0,given:0,pf:0,pa:0};
      const o=s==='h'?'a':'h';r.m++;
      m.log.forEach(e=>{if(e.t===s){r[e.type]++;r.pf++}else{r.pa++;if(e.type==='err')r.given++}});
      for(let i=0;i<=m.n;i++){if(i<m.n||m.done){const q=sc(m,i),a=s==='h'?q[0]:q[1],b=s==='h'?q[1]:q[0];if(a>b)r.sw++;else if(b>a)r.sl++}}})});
  const L=Object.values(R).sort((a,b)=>b.m-a.m||a.name.localeCompare(b.name));
  let h=`<h1>Stats</h1><div class="mut">Totals across every match you have logged. “Errors given” counts points this team handed to opponents.</div>`;
  if(!L.length)return h+`<div class="card"><b>Nothing to show yet.</b><div class="mut">Log a match and each team’s profile appears here.</div></div>`;
  L.forEach(r=>{h+=`<div class="card sc"><div class="row sp"><b style="font-size:18px">${esc(r.name)}</b><span class="mut">${r.m} match${r.m>1?'es':''}, sets ${r.sw}–${r.sl}</span></div>
  <table><tr><th>Points scored</th><th>Kills</th><th>Aces</th><th>Blocks</th><th>Opp. err.</th></tr><tr><td>${r.pf} (allowed ${r.pa})</td><td>${r.kill}</td><td>${r.ace}</td><td>${r.block}</td><td>${r.err}</td></tr></table>
  <div class="mut" style="margin-top:8px">Errors given: ${r.given}. Share of points from attack: ${r.pf?Math.round(r.kill/r.pf*100):0}%, from serve: ${r.pf?Math.round(r.ace/r.pf*100):0}%.</div></div>`});
  return h}

const VER='<div class="mut" style="text-align:center;margin-top:28px;font-size:12px">Version 12</div>';
function render(){
  const m=S.cur&&get(S.cur);
  document.getElementById('app').innerHTML=(m?matchView(m):S.tab==='stats'?statsView():S.tab==='teams'?teamsView():listView())+VER;
  ['matches','teams','stats'].forEach(t=>{const b=document.getElementById('t-'+t);if(S.tab===t&&!m)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});nrStatus()}
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
