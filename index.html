<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volleyball Scout</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e6b73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VB Scout">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef3f2;--card:#fff;--fg:#12262b;--mut:#5d7176;--line:#d3dedd;--home:#0e6b73;--away:#b8730a;--onc:#fff;--bad:#b3362b;--good:#2e8b3d;--yel:#f2c200;--onyel:#1b1b1b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a1d;--card:#13282c;--fg:#e6f0ee;--mut:#8ea5a8;--line:#244045;--home:#3fb4be;--away:#e8a33d;--onc:#0c1a1d;--bad:#ef7b6e;--good:#5fd070;--yel:#f5c518;--onyel:#1b1b1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1a1d;--card:#13282c;--fg:#e6f0ee;--mut:#8ea5a8;--line:#244045;--home:#3fb4be;--away:#e8a33d;--onc:#0c1a1d;--bad:#ef7b6e;--good:#5fd070;--yel:#f5c518;--onyel:#1b1b1b;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.45 Barlow,system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;margin:0}
h1{font-size:30px;letter-spacing:.2px}h2{font-size:22px;margin:22px 0 8px}
button:disabled{opacity:.5;cursor:not-allowed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--home);outline-offset:2px}
.pri{background:var(--home);color:var(--onc);border-color:var(--home);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;color:inherit}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:52px;font-weight:600;color:var(--mut)}
nav button[aria-current=page]{color:var(--home);box-shadow:inset 0 3px 0 var(--home)}
.m{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.m b{font-size:17px}
.board{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;overflow:hidden;margin:12px 0}
.side{padding:12px 14px;color:var(--onc)}
.side.h{background:var(--home)}.side.a{background:var(--away)}
.side .num{font-size:84px;line-height:1}
.side .nm{font-weight:600;overflow-wrap:anywhere}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pts button{min-height:60px;font-weight:600;border-width:2px}
.pts.h button{border-color:var(--home)}.pts.a button{border-color:var(--away)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;border:0;border-radius:0;background:var(--card);font-weight:600}.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--home);color:var(--onc)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;margin:2px 4px 2px 0}
.banner{background:var(--card);border:2px solid var(--bad);border-radius:10px;padding:10px 12px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
.del{color:var(--bad)}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Sections"><button id="t-teams" onclick="go('teams')">Teams</button><button id="t-matches" onclick="go('matches')">Matches</button><button id="t-stats" onclick="go('stats')">Stats</button><button id="t-settings" onclick="go('settings')">Settings</button></nav>
<script>
const K='vb-scout-v1';
const T=[['kill','Attack kill'],['ace','Ace'],['block','Block'],['err','Opp. error']];
const PK='vb-scout-players-v1',TK='vb-scout-teams-v1';
const ROLES=['Setter','Outside hitter','Opposite','Middle blocker','Libero','Defensive specialist'];
let S={m:[],p:[],t:[],r:[],rd:null,cur:null,tab:'teams',form:false,edit:null,team:null,tform:false};
try{const r=localStorage.getItem(K);if(r)S.m=JSON.parse(r)||[]}catch(e){}
try{const r=localStorage.getItem(PK);if(r)S.p=JSON.parse(r)||[]}catch(e){}
try{const r=localStorage.getItem(TK);if(r)S.t=JSON.parse(r)||[]}catch(e){}
const saveP=()=>{try{localStorage.setItem(PK,JSON.stringify(S.p))}catch(e){}};
const saveT=()=>{try{localStorage.setItem(TK,JSON.stringify(S.t))}catch(e){}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S.m))}catch(e){}};
if(S.p.some(p=>!p.teamId)){let t=S.t.find(x=>x.mine);if(!t){t={id:'t-mine',name:'My team',mine:true};S.t.push(t)}S.p.forEach(p=>{if(!p.teamId)p.teamId=t.id});saveT();saveP()}
const myTeam=()=>S.t.find(t=>t.mine);
const SCDEF=[{k:'--',n:'Error',d:'Ball out or on the net. Point to the opponents'},{k:'-',n:'Easy',d:'Easy ball to pass. The opponent setter gets the perfect ball in their hands'},{k:'0',n:'Medium',d:'Ball received, but the opponent setter must move and some setting options are not available'},{k:'+',n:'Tough',d:'The service puts the opponent team in trouble and we get a free ball'},{k:'++',n:'Ace',d:'Ace. Point for us'}];
const SK='vb-scout-scale-v1';
let SC=JSON.parse(JSON.stringify(SCDEF));
try{const r=localStorage.getItem(SK);if(r){const a=JSON.parse(r);if(Array.isArray(a)&&a.length===5)SC=a.map((x,i)=>({k:SCDEF[i].k,n:x.n||SCDEF[i].n,d:x.d||SCDEF[i].d}))}}catch(e){}
function saveScale(){SC=SC.map((x,i)=>({k:x.k,n:(document.getElementById('sc-n'+i).value.trim()||SCDEF[i].n).slice(0,12),d:document.getElementById('sc-d'+i).value.trim()||SCDEF[i].d}));try{localStorage.setItem(SK,JSON.stringify(SC))}catch(e){}render()}
function resetScale(){SC=JSON.parse(JSON.stringify(SCDEF));try{localStorage.removeItem(SK)}catch(e){}render()}
function serve(g){const m=get(S.cur);if(m.done)return;const cl=curLU(m,m.n);if(!cl.serving||!cl.pos[0])return;const L=m.log.length,sl=m.sl=m.sl||[],ls=sl[sl.length-1];if(ls&&ls.s===m.n&&ls.at===L)return;
  sl.push({s:m.n,pid:cl.pos[0],g,at:L});
  if(g==='--')m.log.push({t:'a',type:'err',s:m.n,a:1});else if(g==='++')m.log.push({t:'h',type:'ace',s:m.n,a:1});
  save();render()}
function undo(){const m=get(S.cur),L=m.log.length,sl=m.sl=m.sl||[],ls=sl[sl.length-1];
  if(ls&&ls.s===m.n&&ls.at===L)sl.pop();
  else{const p=m.log[L-1];if(!p||p.s!==m.n)return;m.log.pop();if(p.a&&ls&&ls.at===L-1)sl.pop()}
  save();render()}
function serveCard(m){const cl=curLU(m,m.n);if(m.done||!cl.serving||!cl.pos[0])return'';
  const L=m.log.length,sl=m.sl||[],ls=sl[sl.length-1],rated=ls&&ls.s===m.n&&ls.at===L,e=m.lu.h.find(x=>x.pid===cl.pos[0]),who=e?(e.num?'#'+esc(e.num)+' ':'')+esc(e.name):'';
  if(rated){const g=SC.find(x=>x.k===ls.g);return`<div class="card"><b>Serve${who?': '+who:''}</b><div class="mut">Graded <b>${esc(ls.g)}</b>${g?' ('+esc(g.n)+')':''}. Now record how the rally ended.</div></div>`}
  return`<div class="card"><b>Serve${who?': '+who:''}</b><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px">${SC.map(x=>`<button aria-label="${esc(x.k)} ${esc(x.n)}: ${esc(x.d)}" style="min-height:64px;padding:6px 2px;line-height:1.1${x.k==='--'?';border-color:var(--bad)':x.k==='++'?';border-color:var(--good)':''}" onclick="serve('${x.k}')"><span class="num" style="font-size:26px;display:block">${esc(x.k)}</span><span style="font-size:11px">${esc(x.n)}</span></button>`).join('')}</div><details style="margin-top:8px"><summary class="mut" style="cursor:pointer">What do the grades mean?</summary>${SC.map(x=>`<div class="mut" style="margin-top:4px"><b>${esc(x.k)}</b> ${esc(x.d)}</div>`).join('')}</details></div>`}
function serveTable(m){const sl=m.sl||[];if(!sl.length)return'';const by={};sl.forEach(e=>{const r=by[e.pid]=by[e.pid]||{};r[e.g]=(r[e.g]||0)+1});
  const rows=Object.keys(by).map(pid=>{const e=m.lu.h.find(x=>x.pid===pid),r=by[pid],t=SC.reduce((a,x)=>a+(r[x.k]||0),0);return`<tr><td>${e?(e.num?'#'+esc(e.num)+' ':'')+esc(e.name):'Player'}</td>${SC.map(x=>`<td>${r[x.k]||0}</td>`).join('')}<td>${t}</td></tr>`}).join('');
  return`<h2>Serve grades</h2><div class="card sc"><table><tr><th></th>${SC.map(x=>`<th>${esc(x.k)}</th>`).join('')}<th>All</th></tr>${rows}</table></div>`}
const RK='vb-scout-rules-v1';
try{const r=localStorage.getItem(RK);if(r)S.r=JSON.parse(r)||[]}catch(e){}
const saveR=()=>{try{localStorage.setItem(RK,JSON.stringify(S.r))}catch(e){}};
const BUILT=[{id:'local',name:'Local tournament',roster:false,sets:[{win:25},{win:25},{win:25},{win:25},{win:15}]},{id:'fivb',name:'Official FIVB',roster:true,sets:[{win:25},{win:25},{win:25},{win:25},{win:15}]}];
const allRules=()=>[...BUILT,...S.r];
const getRule=id=>allRules().find(r=>r.id===id)||BUILT[0];
const ruleOf=m=>m.rule||BUILT.find(r=>r.id===m.fmt)||BUILT[0];
const copy=o=>JSON.parse(JSON.stringify(o));
const setRule=(m,si)=>{const R=ruleOf(m);return R.sets[Math.min(si,R.sets.length-1)]};
const ruleText=r=>r.sets.map(s=>s.win+(s.hard?' hard '+s.hard:' win by 2')).join(' | ')+(ruleMin(r)?' | match time '+ruleMin(r)+' min':'');
const fmtT=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const ruleMin=r=>r.min||((r.sets||[]).find(x=>x.min)||{}).min||null;
const tmOf=m=>m.tm&&typeof m.tm.acc==='number'?m.tm:null;
function elapsed(m){const t=tmOf(m);return t?t.acc+(t.run?Date.now()-t.run:0):0}
function timeLeft(m){const n=ruleMin(ruleOf(m));return n?n*60000-elapsed(m):Infinity}
function setWin(m,si,x,y){const r=setRule(m,si),W=r.win,H=r.hard;
  if(H){if(x>=H&&x>y)return['h','points'];if(y>=H&&y>x)return['a','points']}
  if(x>=W&&x-y>=2)return['h','points'];if(y>=W&&y-x>=2)return['a','points'];
  if(ruleMin(ruleOf(m))&&timeLeft(m)<=0&&x!==y)return[x>y?'h':'a','time'];
  return null}
function toggleTimer(){const m=get(S.cur),t=tmOf(m);if(t.run){t.acc+=Date.now()-t.run;t.run=null}else t.run=Date.now();save();render()}
setInterval(()=>{const el=document.getElementById('tmr');if(!el||!S.cur)return;const m=get(S.cur);if(!m)return;const l=timeLeft(m),up=l<=0?'1':'0';if(el.dataset.up!==up){render();return}el.textContent=fmtT(l)},1000);
const byNum=(a,b)=>(parseInt(a.num,10)||999)-(parseInt(b.num,10)||999)||a.name.localeCompare(b.name);
const teamByName=n=>S.t.find(t=>t.name.toLowerCase()===n.toLowerCase());
function ensureTeam(n){let t=teamByName(n);if(!t){t={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,mine:false};S.t.push(t);saveT()}return t}
const snap=t=>S.p.filter(p=>p.teamId===t.id).map(p=>({pid:p.id,name:p.name,num:p.num,role:p.role}));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=id=>S.m.find(m=>m.id===id);
const sc=(m,i)=>{let h=0,a=0;m.log.forEach(e=>{if(e.s===i){e.t==='h'?h++:a++}});return[h,a]};
const target=(m)=>m.n>=4?15:25;
function go(t){S.tab=t;S.cur=null;S.form=false;S.edit=null;S.team=null;S.tform=false;S.rd=null;render()}
function open_(id){S.cur=id;S.mt=get(id).log.length?'scout':'set';S.pick=null;S.setv=null;S.pv='init';render();scrollTo(0,0)}
function nrSel(){return[...document.querySelectorAll('.nr:checked')].map(e=>S.p.find(p=>p.id===e.value))}
function nrStatus(){const el=document.getElementById('nr-st'),f=document.getElementById('f-f');if(!el||!f)return;
  const L=nrSel(),rl=getRule(f.value),fv=rl.roster,c=cnt(L);const rt=document.getElementById('f-rt');if(rt)rt.textContent=ruleText(rl);el.textContent=fv?`${c.pl} of 12 players, ${c.lib} of 2 liberos`:`${L.length} attending`;el.style.color=over({rule:rl},L)?'var(--bad)':''}
function addMatch(){
  const v=id=>document.getElementById(id).value.trim(),my=myTeam();
  const n=v('f-a');if(!n){alert('Enter the opponent name.');return}
  if(n.toLowerCase()===my.name.toLowerCase()){alert('The opponent must be a different team.');return}
  const L=nrSel(),fmt=v('f-f'),msg=over({rule:getRule(fmt)},L);
  if(msg){alert(msg+' Untick some players or switch to Local tournament.');return}
  const A=ensureTeam(n);
  const m={id:Date.now().toString(36),home:my.name,away:A.name,hid:my.id,aid:A.id,lu:{h:L.map(p=>({pid:p.id,name:p.name,num:p.num,role:p.role})),a:[]},fmt,rule:copy(getRule(fmt)),event:'',date:v('f-d')||new Date().toISOString().slice(0,10),n:0,done:false,log:[],notes:'',st:{}};
  S.m.unshift(m);save();S.form=false;open_(m.id)}
function point(t,type){const m=get(S.cur);if(m.done)return;m.log.push({t,type,s:m.n});save();render()}
function endSet(){const m=get(S.cur);if(m.n<ruleOf(m).sets.length-1)m.n++;S.mt='set';S.setv=null;S.pick=null;S.pv='init';save();render();scrollTo(0,0)}
function finish(){const m=get(S.cur);m.done=!m.done;save();render()}
function note(v){get(S.cur).notes=v;save()}
function del(id){if(confirm('Delete this match and its data?')){S.m=S.m.filter(m=>m.id!==id);S.cur=null;save();render()}}
function savePlayer(){
  const v=id=>document.getElementById(id).value.trim();
  const name=v('p-n');if(!name){alert('Enter the player’s name.');return}
  const num=v('p-#');
  if(num!==''&&S.p.some(p=>p.teamId===S.team&&p.num===num&&p.id!==S.edit)&&!confirm('Another player already wears #'+num+'. Save anyway?'))return;
  const d={name,num,role:v('p-r')};
  if(S.edit&&S.edit!=='new'){Object.assign(S.p.find(p=>p.id===S.edit),d)}else{S.p.push({id:Date.now().toString(36),teamId:S.team,...d})}
  saveP();S.edit=null;render()}
function editPlayer(id){S.edit=id;render();const el=document.getElementById('p-n');if(el)el.focus()}
function delPlayer(id){const p=S.p.find(p=>p.id===id);if(confirm('Remove '+p.name+' from the roster? Past matches keep their own copy.')){S.p=S.p.filter(p=>p.id!==id);saveP();S.edit=null;render()}}
function addTeam(){const n=document.getElementById('tm-n').value.trim();if(!n){alert('Enter a team name.');return}
  if(teamByName(n)){alert('That team already exists.');return}
  const mine=document.getElementById('tm-m').checked;if(mine)S.t.forEach(t=>t.mine=false);
  const t={id:'t'+Date.now().toString(36),name:n,mine};S.t.push(t);saveT();S.tform=false;S.team=t.id;render()}
function openTeam(id){S.team=id;S.edit=null;render();scrollTo(0,0)}
function toggleMine(){const t=S.t.find(t=>t.id===S.team);const on=!t.mine;S.t.forEach(x=>x.mine=false);t.mine=on;saveT();render()}
function renameTeam(){const t=S.t.find(t=>t.id===S.team);const n=prompt('Team name',t.name);if(n&&n.trim()){t.name=n.trim();saveT();render()}}
function delTeam(){const t=S.t.find(t=>t.id===S.team);if(confirm('Delete '+t.name+' and its roster? Matches already logged keep their data.')){S.p=S.p.filter(p=>p.teamId!==t.id);S.t=S.t.filter(x=>x.id!==t.id);S.team=null;saveP();saveT();render()}}
const cnt=L=>{const lib=L.filter(x=>x.role==='Libero').length;return{lib,pl:L.length-lib}};
const over=(m,L)=>{if(!ruleOf(m).roster)return'';const c=cnt(L);return c.pl>12?'The roster limit is 12 players plus liberos.':c.lib>2?'The roster limit is 2 liberos.':''};
function luSet(s,i,f,v){const m=get(S.cur),L=m.lu[s],t=L.map(x=>({...x}));t[i][f]=v.trim();
  if(f==='role'&&over(m,t)){alert(over(m,t));render();return}
  L[i][f]=v.trim();save();render()}
function unplace(m,pid){Object.values(m.st||{}).forEach(a=>a.forEach((x,i)=>{if(x===pid)a[i]=null}))}
function luDel(s,i){const m=get(S.cur);unplace(m,m.lu[s][i].pid);m.lu[s].splice(i,1);save();render()}
function luToggle(s,pid,on){const m=get(S.cur),L=m.lu[s];
  if(on){const p=S.p.find(p=>p.id===pid),t=[...L,{role:p.role}];if(over(m,t)){alert(over(m,t)+' Remove someone first or change a role.');render();return}
    L.push({pid:p.id,name:p.name,num:p.num,role:p.role})}
  else{unplace(m,pid);m.lu[s]=L.filter(x=>x.pid!==pid)}
  save();render()}
function luGuest(s){const m=get(S.cur),n=(prompt('Player name')||'').trim();if(!n)return;const num=(prompt('Shirt number (optional)')||'').trim();
  const t=[...m.lu[s],{role:''}];if(over(m,t)){alert(over(m,t));return}
  m.lu[s].push({pid:'g'+Date.now().toString(36),name:n,num,role:''});save();render()}
function setFmt(v){const m=get(S.cur);m.fmt=v;m.rule=copy(getRule(v));save();render()}
function luRow(s,x,i,lead,rm){return`<div class="row" style="margin-top:8px;flex-wrap:nowrap">${lead}<input aria-label="Shirt number for ${esc(x.name)}" style="width:60px" inputmode="numeric" maxlength="3" value="${esc(x.num)}" onchange="luSet('${s}',${i},'num',this.value)"><select aria-label="Role for ${esc(x.name)}" style="width:auto;max-width:42%" onchange="luSet('${s}',${i},'role',this.value)"><option value="">No role</option>${ROLES.map(r=>`<option${x.role===r?' selected':''}>${r}</option>`).join('')}</select>${rm?`<button aria-label="Remove ${esc(x.name)}" onclick="luDel('${s}',${i})">✕</button>`:''}</div>`}
function luHtml(m,s){const L=m.lu[s],id=s==='h'?m.hid:m.aid,fv=ruleOf(m).roster,c=cnt(L),ro=S.p.filter(p=>p.teamId===id).sort((a,b)=>(parseInt(a.num,10)||999)-(parseInt(b.num,10)||999)||a.name.localeCompare(b.name));
  const st=fv?`${c.pl} of 12 players, ${c.lib} of 2 liberos${c.lib<1?'. Add at least 1 libero.':''}`:`${L.length} attending`;
  let h=`<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px"><div class="row sp"><b>${esc(s==='h'?m.home:m.away)}</b><span class="mut" ${over(m,L)||(fv&&c.lib<1)?'style="color:var(--bad)"':''}>${st}</span></div>`;
  ro.forEach(p=>{const i=L.findIndex(x=>x.pid===p.id);const lead=`<label style="display:flex;gap:8px;align-items:center;color:var(--fg);font-size:16px;margin:0;flex:1;min-width:0"><input type="checkbox" style="width:22px;height:22px;flex:none" ${i>=0?'checked':''} onchange="luToggle('${s}','${p.id}',this.checked)"><span style="overflow-wrap:anywhere">${esc(p.name)}</span></label>`;

  <h2>How points were scored</h2><div class="card sc"><table><tr><th></th><th>${esc(m.home)}</th><th>${esc(m.away)}</th></tr>${T.map(([k,l])=>`<tr><td>${l}</td><td>${tl.h[k]||0}</td><td>${tl.a[k]||0}</td></tr>`).join('')}</table></div>
  ${serveTable(m)}<h2>Scouting notes</h2><textarea rows="5" aria-label="Scouting notes" placeholder="Rotations, serving targets, weak passers, setter habits" onchange="note(this.value)">${esc(m.notes)}</textarea>`;
  return h}

function teamsView(){
  if(S.team){
    const t=S.t.find(x=>x.id===S.team),ed=S.edit&&S.edit!=='new'?S.p.find(p=>p.id===S.edit):null;
    const L=S.p.filter(p=>p.teamId===t.id).sort((a,b)=>(parseInt(a.num,10)||999)-(parseInt(b.num,10)||999)||a.name.localeCompare(b.name));
    let h=`<div class="row sp"><button onclick="S.team=null;S.edit=null;render()">Back</button><div class="row"><button onclick="toggleMine()">${t.mine?'Not my team':'Set as my team'}</button><button onclick="renameTeam()">Rename</button><button class="del" onclick="delTeam()">Delete</button></div></div>
    <div class="row sp" style="margin-top:10px"><h1>${esc(t.name)}</h1>${S.edit?'':'<button class="pri" onclick="editPlayer(\'new\')">Add player</button>'}</div>
    <div class="mut">${t.mine?'Your team. ':''}These are default numbers and roles. Each new match gets a copy you can change without touching this roster.</div>`;
    if(S.edit)h+=`<div class="card"><label for="p-n">Name</label><input id="p-n" autocomplete="off" value="${esc(ed?ed.name:'')}"><label for="p-#">Shirt number</label><input id="p-#" inputmode="numeric" maxlength="3" autocomplete="off" value="${esc(ed?ed.num:'')}"><label for="p-r">Preferred role</label><select id="p-r"><option value="">Not set</option>${ROLES.map(r=>`<option${ed&&ed.role===r?' selected':''}>${r}</option>`).join('')}</select>
    <div class="row" style="margin-top:14px"><button class="pri" onclick="savePlayer()">Save player</button><button onclick="S.edit=null;render()">Cancel</button>${ed?`<button class="del" onclick="delPlayer('${ed.id}')">Remove</button>`:''}</div></div>`;
    if(!L.length&&!S.edit)h+=`<div class="card"><b>No players yet.</b><div class="mut">Add each player with a shirt number and preferred role.</div></div>`;
    L.forEach(p=>{h+=`<button class="m" onclick="editPlayer('${p.id}')"><div class="row"><span class="num" style="font-size:34px;min-width:52px">${p.num?'#'+esc(p.num):'–'}</span><div><b>${esc(p.name)}</b><div class="mut">${p.role?esc(p.role):'Role not set'}</div></div></div></button>`});
    return h}
  let h=`<div class="row sp"><h1>Teams</h1><button class="pri" onclick="S.tform=!S.tform;render()">${S.tform?'Cancel':'Add team'}</button></div>`;
  if(S.tform)h+=`<div class="card"><label for="tm-n">Team name</label><input id="tm-n" autocomplete="off"><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="tm-m" type="checkbox" style="width:auto" ${S.t.length?'':'checked'}>This is my team</label><div style="margin-top:14px"><button class="pri" onclick="addTeam()">Save team</button></div></div>`;
  if(!S.t.length&&!S.tform)h+=`<div class="card"><b>Start with your own team.</b><div class="mut">Save it once with its players, then pick it for every match. Opponents can be saved too.</div></div>`;
  [...S.t].sort((a,b)=>(b.mine?1:0)-(a.mine?1:0)||a.name.localeCompare(b.name)).forEach(t=>{const n=S.p.filter(p=>p.teamId===t.id).length;
    h+=`<button class="m" onclick="openTeam('${t.id}')"><div class="row sp"><b>${esc(t.name)}</b><span class="mut">${t.mine?'Your team, ':''}${n} player${n===1?'':'s'}</span></div></button>`});
  return h}

function settingsView(){
  if(S.rd)return ruleForm();
  let h=`<h1>Settings</h1><h2 style="margin-top:8px">Tournament rules</h2><div class="mut">A rule set defines the number of sets, the points to win, hard limits and time limits. You pick one when you create a match.</div>`;
  allRules().forEach(r=>{const bi=BUILT.some(b=>b.id===r.id);
    h+=`<div class="card"><div class="row sp"><b>${esc(r.name)}</b>${bi?'<span class="mut">Built in</span>':`<button onclick="editRule('${r.id}')">Edit</button>`}</div>${r.sets.map((x,i)=>`<div class="mut">Set ${i+1}: ${x.win} to win${x.hard?', hard limit '+x.hard:', win by 2'}</div>`).join('')}${ruleMin(r)?`<div class="mut">Match time: ${ruleMin(r)} minutes</div>`:''}${r.roster?'<div class="mut">Roster limit: 12 players + 1 or 2 liberos</div>':''}</div>`});
  h+=`<button class="pri" onclick="newRule()">Create rule set</button><h2>Serve grades</h2><div class="mut">Five buttons appear when your team serves. The symbols are fixed; you can rename them and change the descriptions. A -- gives the opponents the point and a ++ gives your team the point.</div>${SC.map((x,i)=>`<div class="card"><b>${esc(x.k)}</b><label for="sc-n${i}">Short label</label><input id="sc-n${i}" maxlength="12" value="${esc(x.n)}"><label for="sc-d${i}">Description</label><input id="sc-d${i}" value="${esc(x.d)}"></div>`).join('')}<div class="row"><button class="pri" onclick="saveScale()">Save grades</button><button onclick="resetScale()">Reset to defaults</button></div>`;
  return h}
const RD0=()=>({id:null,name:'',min:null,roster:false,sets:[{win:21,hard:23},{win:21,hard:23},{win:15,hard:15}]});
function newRule(){S.rd=RD0();render()}
function editRule(id){S.rd=copy(S.r.find(r=>r.id===id));S.rd.min=ruleMin(S.rd);S.rd.sets.forEach(x=>{delete x.min});render()}
function syncRule(){const d=S.rd,g=i=>document.getElementById(i);if(!g('r-n'))return;d.name=g('r-n').value.trim();d.roster=g('r-ro').checked;d.min=parseInt(g('r-t').value,10)||null;
  d.sets=d.sets.map((x,i)=>({win:parseInt(g('r-w'+i).value,10)||0,hard:parseInt(g('r-h'+i).value,10)||null}))}
function ruleCount(n){syncRule();const d=S.rd;n=Math.max(1,Math.min(5,n));while(d.sets.length<n)d.sets.push({...d.sets[d.sets.length-1]});d.sets.length=n;render()}
function saveRule(){syncRule();const d=S.rd;
  if(!d.name){alert('Give the rule set a name.');return}
  if(allRules().some(r=>r.id!==d.id&&r.name.toLowerCase()===d.name.toLowerCase())){alert('A rule set with that name already exists.');return}
  for(let i=0;i<d.sets.length;i++){const x=d.sets[i];if(x.win<1){alert('Set '+(i+1)+': enter the points needed to win.');return}if(x.hard&&x.hard<x.win){alert('Set '+(i+1)+': the hard limit cannot be lower than the points to win.');return}}
  if(d.id){S.r[S.r.findIndex(r=>r.id===d.id)]=d}else{d.id='r'+Date.now().toString(36);S.r.push(d)}saveR();S.rd=null;render()}
function delRule(){const d=S.rd;if(d.id&&confirm('Delete this rule set? Matches already created keep their own copy.')){S.r=S.r.filter(r=>r.id!==d.id);saveR()}S.rd=null;render()}
function ruleForm(){const d=S.rd;
  return`<div class="row sp"><button onclick="S.rd=null;render()">Back</button>${d.id?'<button class="del" onclick="delRule()">Delete</button>':''}</div><h1 style="margin-top:10px">${d.id?'Edit rule set':'New rule set'}</h1>
  <div class="card"><label for="r-n">Name</label><input id="r-n" autocomplete="off" value="${esc(d.name)}" placeholder="For example SADVA"><label for="r-c">Number of sets</label><select id="r-c" onchange="ruleCount(+this.value)">${[1,2,3,4,5].map(n=>`<option${n===d.sets.length?' selected':''}>${n}</option>`).join('')}</select>
  <label for="r-t">Match time in minutes (optional)</label><input id="r-t" inputmode="numeric" placeholder="untimed" value="${d.min||''}">
  <label style="display:flex;gap:8px;align-items:center;color:var(--fg);font-size:16px;margin-top:14px"><input id="r-ro" type="checkbox" style="width:22px;height:22px;flex:none" ${d.roster?'checked':''}>Limit the roster to 12 players + 1 or 2 liberos</label></div>
  ${d.sets.map((x,i)=>`<div class="card"><b>Set ${i+1}</b><div class="row" style="flex-wrap:nowrap;margin-top:4px;align-items:flex-start"><div style="flex:1;min-width:0"><label for="r-w${i}">Points to win</label><input id="r-w${i}" inputmode="numeric" value="${x.win||''}"></div><div style="flex:1;min-width:0"><label for="r-h${i}">Hard limit</label><input id="r-h${i}" inputmode="numeric" placeholder="none" value="${x.hard||''}"></div></div></div>`).join('')}
  <div class="mut">Points to win: the team also needs a 2-point lead. Hard limit: the first team to reach it wins, even without a 2-point lead; leave empty for no limit. Match time: one countdown for the whole match. When it runs out, the team with more points wins the set in progress and the match is over. Leave empty for an untimed match.</div>
  <div style="margin-top:14px"><button class="pri" onclick="saveRule()">Save rule set</button></div>`}

function serveStats(){
  const F=S.sf=S.sf||{opp:'',from:'',to:''},any=S.m.some(m=>(m.sl||[]).length);
  let h=`<h2 style="margin-top:8px">Serving by player</h2>`;
  if(!any)return h+`<div class="card"><b>No graded serves yet.</b><div class="mut">Grade serves on the scout page while your team is serving, and each player's totals appear here.</div></div>`;
  const opps=[...new Set(S.m.map(m=>m.away))].sort(),ms=S.m.filter(m=>(m.sl||[]).length&&(!F.opp||m.away===F.opp)&&(!F.from||m.date>=F.from)&&(!F.to||m.date<=F.to));
  const by={};
  ms.forEach(m=>m.sl.forEach(e=>{const p=S.p.find(x=>x.id===e.pid),le=m.lu.h.find(x=>x.pid===e.pid),name=p?p.name:le?le.name:'Player',key=p?e.pid:'n:'+name.toLowerCase();const r=by[key]=by[key]||{name,c:{}};r.c[e.g]=(r.c[e.g]||0)+1}));
  const tot=r=>SC.reduce((a,x)=>a+(r.c[x.k]||0),0),pc=(n,t)=>t?Math.round(n/t*100)+'%':'–';
  const rows=Object.values(by).sort((a,b)=>tot(b)-tot(a)||a.name.localeCompare(b.name)),all={name:'Whole team',c:{}};
  rows.forEach(r=>SC.forEach(x=>{all.c[x.k]=(all.c[x.k]||0)+(r.c[x.k]||0)}));
  const tr=r=>{const t=tot(r);return`<tr><td>${esc(r.name)}</td>${SC.map(x=>`<td>${r.c[x.k]||0}</td>`).join('')}<td>${t}</td><td>${pc((r.c['+']||0)+(r.c['++']||0),t)}</td><td>${pc(r.c['--']||0,t)}</td></tr>`};
  h+=`<div class="card"><div class="row" style="gap:10px;align-items:flex-start"><div style="flex:1;min-width:140px"><label for="sf-o">Opponent</label><select id="sf-o" onchange="S.sf.opp=this.value;render()"><option value="">All opponents</option>${opps.map(o=>`<option value="${esc(o)}"${F.opp===o?' selected':''}>${esc(o)}</option>`).join('')}</select></div><div style="flex:1;min-width:120px"><label for="sf-f">From</label><input id="sf-f" type="date" value="${esc(F.from)}" onchange="S.sf.from=this.value;render()"></div><div style="flex:1;min-width:120px"><label for="sf-t">To</label><input id="sf-t" type="date" value="${esc(F.to)}" onchange="S.sf.to=this.value;render()"></div></div>${F.opp||F.from||F.to?'<div style="margin-top:10px"><button onclick="S.sf={opp:\'\',from:\'\',to:\'\'};render()">Clear filters</button></div>':''}</div>`;
  if(!rows.length)return h+`<div class="card"><div class="mut">No graded serves match these filters.</div></div>`;
  return h+`<div class="mut">${ms.length} match${ms.length===1?'':'es'}, ${tot(all)} graded serves. Good = ${esc(SC[3].k)} and ${esc(SC[4].k)}, Err = ${esc(SC[0].k)}.</div><div class="card sc"><table><tr><th>Player</th>${SC.map(x=>`<th>${esc(x.k)}</th>`).join('')}<th>All</th><th>Good</th><th>Err</th></tr>${rows.map(tr).join('')}<tr style="font-weight:600">${tr(all).slice(4)}</table></div>`}

function statsView(){
  const R={};
  S.m.forEach(m=>{
    [['h',m.home],['a',m.away]].forEach(([s,name])=>{
      const k=name.toLowerCase();const r=R[k]=R[k]||{name,m:0,sw:0,sl:0,kill:0,ace:0,block:0,err:0,given:0,pf:0,pa:0};
      const o=s==='h'?'a':'h';r.m++;
      m.log.forEach(e=>{if(e.t===s){r[e.type]++;r.pf++}else{r.pa++;if(e.type==='err')r.given++}});
      for(let i=0;i<=m.n;i++){if(i<m.n||m.done){const q=sc(m,i),a=s==='h'?q[0]:q[1],b=s==='h'?q[1]:q[0];if(a>b)r.sw++;else if(b>a)r.sl++}}})});
  const L=Object.values(R).sort((a,b)=>b.m-a.m||a.name.localeCompare(b.name));
  let h=`<h1>Stats</h1>${serveStats()}<h2>Teams</h2><div class="mut">Totals across every match you have logged. “Errors given” counts points this team handed to opponents.</div>`;
  if(!L.length)return h+`<div class="card"><b>Nothing to show yet.</b><div class="mut">Log a match and each team’s profile appears here.</div></div>`;
  L.forEach(r=>{h+=`<div class="card sc"><div class="row sp"><b style="font-size:18px">${esc(r.name)}</b><span class="mut">${r.m} match${r.m>1?'es':''}, sets ${r.sw}–${r.sl}</span></div>
  <table><tr><th>Points scored</th><th>Kills</th><th>Aces</th><th>Blocks</th><th>Opp. err.</th></tr><tr><td>${r.pf} (allowed ${r.pa})</td><td>${r.kill}</td><td>${r.ace}</td><td>${r.block}</td><td>${r.err}</td></tr></table>
  <div class="mut" style="margin-top:8px">Errors given: ${r.given}. Share of points from attack: ${r.pf?Math.round(r.kill/r.pf*100):0}%, from serve: ${r.pf?Math.round(r.ace/r.pf*100):0}%.</div></div>`});
  return h}

const VER='<div class="mut" style="text-align:center;margin-top:28px;font-size:12px">Version 18</div>';
function render(){
  const m=S.cur&&get(S.cur);
  document.getElementById('app').innerHTML=(m?matchView(m):S.tab==='stats'?statsView():S.tab==='settings'?settingsView():S.tab==='teams'?teamsView():listView())+VER;
  ['matches','teams','stats','settings'].forEach(t=>{const b=document.getElementById('t-'+t);if(S.tab===t&&!m)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});nrStatus()}
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
